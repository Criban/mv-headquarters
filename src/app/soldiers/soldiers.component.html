<section class="soldiers" aria-label="Soldaten auswählen">
  <div class="scene-top"><span>MV / EINSATZTEAM</span><span>{{ players().length }} MITGLIEDER</span></div>
  <div class="soldier-scene" [class.history-open]="squadActive() && historyOpen()" [style.--selected-index]="selected()" [style.--soldier-count]="players().length"
    [style.--hall-brightness]="lighting().hallBrightness" [style.--hall-saturation]="lighting().hallSaturation"
    [style.--scene-portrait-light]="lighting().portraitLight" [style.--scene-warmth]="lighting().warmth"
    [style.--scene-sunlight]="lighting().sunlight" [style.--scene-night-tint]="lighting().nightTint">
    <div class="hangar-stage" aria-hidden="true">
      <div class="hangar-world">
        @if (design().id === 'rooftop-daylight') {
          <span class="city-smoke city-smoke-east"></span>
          <span class="city-smoke city-smoke-west"></span>
        }
      </div>
    </div>

    <div class="soldier-buttons" [style.--soldier-count]="players().length">
      @for (player of players(); track $index) {
        <button class="soldier" type="button" [disabled]="!!player.inactive" [class.inactive]="player.inactive" [class.seated]="player.image === 'images/54bi44-camping-chair.png'" [attr.inert]="historyOpen() && squadActive() && selected() !== $index ? '' : null" [class.selected]="squadActive() && selected() === $index" [attr.aria-pressed]="squadActive() && selected() === $index" [attr.aria-label]="player.name + (player.inactive ? ': Inaktiv' : player.privateProfile ? ': Privates Profil anzeigen' : ': Statistiken anzeigen')" (click)="soldierSelected.emit($index)">
          <span class="soldier-portrait">
            <svg class="soldier-ground-shadow" viewBox="0 0 1024 1536" aria-hidden="true" focusable="false">
              @if (player.image === 'images/54bi44-camping-chair.png') {
                <ellipse class="cast-shadow" cx="520" cy="1345" rx="420" ry="105" transform="rotate(-7 520 1345)" />
                <ellipse class="chair-seat-shadow" cx="495" cy="1320" rx="290" ry="78" />
                <ellipse class="contact-shadow" cx="175" cy="1275" rx="45" ry="17" />
                <ellipse class="contact-shadow" cx="320" cy="1375" rx="48" ry="18" />
                <ellipse class="contact-shadow" cx="620" cy="1265" rx="42" ry="16" />
                <ellipse class="contact-shadow" cx="450" cy="1435" rx="95" ry="22" />
                <ellipse class="contact-shadow" cx="865" cy="1435" rx="105" ry="22" />
              } @else if (player.image === 'images/kingcoffee-coffee-break.png') {
                <ellipse class="cast-shadow" cx="590" cy="1435" rx="400" ry="65" transform="rotate(-7 590 1435)" />
                <ellipse class="contact-shadow" cx="375" cy="1410" rx="105" ry="24" />
                <ellipse class="contact-shadow" cx="750" cy="1400" rx="225" ry="28" />
              } @else {
                <ellipse class="cast-shadow" cx="430" cy="1460" rx="335" ry="58" transform="rotate(-7 430 1460)" />
                <ellipse class="contact-shadow" cx="510" cy="1455" rx="225" ry="28" />
              }
            </svg>
            <app-soldier-portrait [src]="player.image" [description]="player.imageAlt" [index]="$index" [inactive]="!!player.inactive" [design]="design()" />
          </span>
          <span class="soldier-label"><span class="slot-number">0{{ $index + 1 }} / MV</span><strong>{{ player.name }}</strong><span class="selection-caption">{{ player.inactive ? 'INAKTIV' : squadActive() && selected() === $index ? 'AUSGEWÄHLT' : 'AUSWÄHLEN' }}</span></span>
        </button>
      }
    </div>
    <app-battlefield-history [player]="players()[selected()]" [stats]="stats()" [(open)]="historyOpen" />
  </div>
  <div class="scene-bottom"><span>↵ SOLDAT AUSWÄHLEN</span></div>
</section>
