<!-- Apply directional ambient light to the complete portrait, including animated layers. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter [attr.id]="'portrait-daylight-' + index()" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="matrix" [attr.values]="design().portraitMatrix" result="litPortrait" />
      <feImage [attr.href]="'images/' + design().portraitLightMap + (src() === 'images/54bi44-camping-chair.png' ? '-mirrored' : '') + '.svg'" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="ambientLight" />
      <feComposite in="ambientLight" in2="SourceGraphic" operator="in" result="surfaceLight" />
      <feComponentTransfer in="surfaceLight" result="subtleLight">
        <feFuncA type="linear" [attr.slope]="design().portraitLightStrength" />
      </feComponentTransfer>
      <feBlend in="subtleLight" in2="litPortrait" mode="soft-light" />
    </filter>
  </defs>
</svg>
@if (index() === 0 && !failed()) {
  <svg class="soldier-image blackhawk-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/blackhawk-rig/legs.png" x="90" y="395" width="798.72" height="1198.08" (error)="failed.set(true)" />
    <g class="ribcage">
      <image href="images/blackhawk-rig/torso.png" x="200" y="95" width="634.88" height="952.32" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/blackhawk-rig/head.png" x="215" y="15" width="512" height="768" (error)="failed.set(true)" />
    </g>
    <g class="arms-weapon">
      <image href="images/blackhawk-rig/arms-weapon.png" x="185" y="-30" width="839.68" height="1259.52" (error)="failed.set(true)" />
    </g>
  </svg>
} @else if (index() === 1 && !failed()) {
  <svg class="soldier-image criban-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/criban-rig/legs.png" x="102" y="425" width="778.24" height="1167.36" (error)="failed.set(true)" />
    <g class="arm-left">
      <image href="images/criban-rig/arm-left.png" x="45" y="55" width="819.2" height="1228.8" (error)="failed.set(true)" />
    </g>
    <g class="arm-right">
      <image href="images/criban-rig/arm-right.png" x="117" y="16" width="839.68" height="1259.52" (error)="failed.set(true)" />
    </g>
    <g class="ribcage">
      <image href="images/criban-rig/torso.png" x="180" y="105" width="614.4" height="921.6" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/criban-rig/head.png" x="245" y="0" width="512" height="768" (error)="failed.set(true)" />
    </g>
  </svg>
} @else if (index() === 2 && !failed()) {
  <svg class="soldier-image kingcoffee-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/kingcoffee-rig/legs.png" width="1024" height="1536" (error)="failed.set(true)" />
    <g class="ribcage">
      <image href="images/kingcoffee-rig/torso.png" x="230" y="20" width="552.96" height="921.6" preserveAspectRatio="none" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/kingcoffee-rig/head.png" x="280" y="5" width="460.8" height="691.2" (error)="failed.set(true)" />
    </g>
    <g class="arms-weapon">
      <image href="images/kingcoffee-rig/arms-weapon.png" x="210" y="0" width="665.6" height="1090.56" preserveAspectRatio="none" (error)="failed.set(true)" />
    </g>
  </svg>
} @else if (index() === 3 && !failed()) {
  <svg class="soldier-image seated-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/54bi44-rig/base.png" x="45" y="115" width="942.08" height="1413.12" (error)="failed.set(true)" />
    <g class="resting-arms">
      <image href="images/54bi44-rig/arms.png" x="50" y="20" width="870.4" height="1305.6" (error)="failed.set(true)" />
    </g>
    <g class="ribcage">
      <image href="images/54bi44-rig/torso.png" x="200" y="180" width="583.68" height="875.52" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/54bi44-rig/head.png" x="164" y="93" width="624.64" height="936.96" (error)="failed.set(true)" />
    </g>
  </svg>
} @else {
  <img class="soldier-image" [class.kingcoffee-portrait]="index() === 2" [src]="src()" [alt]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" width="1024" height="1536">
}
