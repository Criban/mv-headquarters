<!-- Apply directional ambient light to the complete portrait, including animated layers. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter [attr.id]="'portrait-daylight-' + index()" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="matrix" [attr.values]="design().portraitMatrix" result="litPortrait" />
      <feImage [attr.href]="'images/' + design().portraitLightMap + (src() === 'images/54bi44-camping-chair.png' ? '-mirrored' : '') + '.svg'" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="ambientLight" />
      <feComposite in="ambientLight" in2="SourceGraphic" operator="in" result="surfaceLight" />
      <feComponentTransfer in="surfaceLight" result="subtleLight">
        <feFuncA type="linear" [attr.slope]="design().portraitLightStrength" />
      </feComponentTransfer>
      <feBlend in="subtleLight" in2="litPortrait" mode="soft-light" />
    </filter>
  </defs>
</svg>
@if (index() === 0 && !failed()) {
  <svg class="soldier-image blackhawk-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/blackhawk-forward-rig/legs.png" x="75" y="375" width="880.64" height="1232" preserveAspectRatio="none" (error)="failed.set(true)" />
    <g class="ribcage">
      <image href="images/blackhawk-forward-rig/torso.png" x="180" y="78" width="665.6" height="998.4" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/blackhawk-forward-rig/head.png" x="309" y="14" width="368.64" height="552.96" (error)="failed.set(true)" />
    </g>
    <g class="arms-weapon">
      <image href="images/blackhawk-forward-rig/arms-weapon.png" x="219" y="-20" width="542.72" height="814.08" (error)="failed.set(true)" />
    </g>
  </svg>
} @else if (index() === 1 && !failed()) {
  <svg class="soldier-image criban-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient [attr.id]="'criban-ground-shadow-' + index()">
        <stop offset="0" stop-color="#080b0c" stop-opacity=".78" />
        <stop offset=".45" stop-color="#080b0c" stop-opacity=".48" />
        <stop offset="1" stop-color="#080b0c" stop-opacity="0" />
      </radialGradient>
    </defs>
    <!-- Fixed sole contact shadows stay on the floor while the upper body breathes. -->
    <ellipse cx="359" cy="1486" rx="126" ry="28" [attr.fill]="'url(#criban-ground-shadow-' + index() + ')'" />
    <ellipse cx="721" cy="1508" rx="106" ry="26" [attr.fill]="'url(#criban-ground-shadow-' + index() + ')'" />
    <image href="images/criban-black-rig/legs.png" x="130" y="450" width="768" height="1152" (error)="failed.set(true)" />
    <g class="arm-right">
      <image href="images/criban-black-rig/arm-right.png" x="310" y="210" width="512" height="768" (error)="failed.set(true)" />
    </g>
    <g class="ribcage">
      <image href="images/criban-black-rig/torso.png" x="284" y="126" width="435.2" height="652.8" (error)="failed.set(true)" />
    </g>
    <g class="arm-left">
      <image href="images/criban-black-rig/arm-left.png" x="190" y="181" width="614.4" height="921.6" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/criban-black-rig/head.png" x="361" y="0" width="296.96" height="445.44" (error)="failed.set(true)" />
    </g>
  </svg>
} @else if (index() === 2 && !failed()) {
  <svg class="soldier-image kingcoffee-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/kingcoffee-coffee-rig/base.png" y="25" width="1024" height="1536" (error)="failed.set(true)" />
    <g class="ribcage">
      <image href="images/kingcoffee-coffee-rig/torso.png" x="190" y="135" width="614.4" height="921.6" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/kingcoffee-coffee-rig/head.png" x="150" y="8" width="716.8" height="1075.2" (error)="failed.set(true)" />
    </g>
    <g class="coffee-arms">
      <image href="images/kingcoffee-coffee-rig/arms.png" x="200" y="50" width="614.4" height="921.6" (error)="failed.set(true)" />
    </g>
  </svg>
} @else if (index() === 3 && !failed()) {
  <svg class="soldier-image seated-rig" viewBox="0 0 1024 1536" width="1024" height="1536"
    role="img" [attr.aria-label]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" xmlns="http://www.w3.org/2000/svg">
    <image href="images/54bi44-rig/base.png" x="45" y="115" width="942.08" height="1413.12" (error)="failed.set(true)" />
    <g class="resting-arms">
      <image href="images/54bi44-rig/arms.png" x="50" y="20" width="870.4" height="1305.6" (error)="failed.set(true)" />
    </g>
    <g class="ribcage">
      <image href="images/54bi44-rig/torso.png" x="200" y="180" width="583.68" height="875.52" (error)="failed.set(true)" />
    </g>
    <g class="head">
      <image href="images/54bi44-rig/head.png" x="164" y="93" width="624.64" height="936.96" (error)="failed.set(true)" />
    </g>
  </svg>
} @else {
  <img class="soldier-image" [class.kingcoffee-portrait]="index() === 2" [src]="src()" [alt]="description()" [style.--portrait-light-filter]="'url(#portrait-daylight-' + index() + ')'" width="1024" height="1536">
}
