name: Publish GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      initialize_history:
        description: Create the Neon history table before capturing
        type: boolean
        default: false
      import_browser_history:
        description: Import the supplied browser history (existing database days stay unchanged)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Initialize Neon history
        if: github.event_name == 'workflow_dispatch' && inputs.initialize_history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run history:init
      - name: Import and export browser history
        if: github.event_name == 'workflow_dispatch' && inputs.import_browser_history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run history:import
      - name: Capture and export shared history
        if: github.event_name != 'workflow_dispatch' || !inputs.import_browser_history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npm run history:sync
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "DATABASE_URL is required for scheduled history capture."
            exit 1
          else
            echo "Neon is not configured yet; publishing the bundled data."
          fi
      - name: Check history
        run: npm run test:history
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Angular
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bf6-squad/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
