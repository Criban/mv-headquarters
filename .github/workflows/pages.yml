name: Publish GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * *'
      timezone: 'Europe/Berlin'
    - cron: '45 21 * * *'
      timezone: 'Europe/Berlin'
    - cron: '30 23 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture and export shared history
        run: |
          for attempt in 1 2 3; do
            if npm run history:sync; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "History capture failed after three attempts; keeping the previous publication."
              exit 1
            fi
            delay=$((attempt * 30))
            echo "History capture failed on attempt $attempt; retrying in $delay seconds."
            sleep "$delay"
          done
      - name: Persist daily history
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          capture_path="$RUNNER_TEMP/bf6-capture.json"
          cp public/data/bf6-stats-snapshot.json "$capture_path"
          for attempt in 1 2 3; do
            # Discard only regenerated files, then advance to the latest source and history.
            git restore --source=HEAD --staged --worktree -- public/data/bf6-stats-history.json public/data/bf6-stats-snapshot.json
            git pull --ff-only origin main
            node scripts/file-history.mjs --merge-snapshot "$capture_path"
            npm ci
            npm run test:history
            git add public/data/bf6-stats-history.json public/data/bf6-stats-snapshot.json
            if git diff --cached --quiet; then
              break
            fi
            git commit -m "Update BF6 daily history"
            if git push origin HEAD:main; then
              break
            fi
            # Undo only the bot commit just created; the capture remains saved outside Git.
            git reset --soft HEAD^
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to persist history after three attempts; keeping the previous publication."
              exit 1
            fi
            echo "Push rejected; merging the capture into the latest main before retrying."
          done
      - name: Check history
        run: npm run test:history
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Angular
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base-href "${BASE_PATH}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bf6-squad/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
